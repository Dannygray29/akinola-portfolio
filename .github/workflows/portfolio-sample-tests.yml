name: Portfolio sample tests

on:
  push:
    branches: [main]
    paths:
      - "samples/deterministic-fuzz/**"
      - ".github/workflows/portfolio-sample-tests.yml"
  pull_request:
    paths:
      - "samples/deterministic-fuzz/**"
      - ".github/workflows/portfolio-sample-tests.yml"

permissions:
  contents: read

jobs:
  deterministic-fuzz-sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run deterministic fuzz tests
        run: node --test samples/deterministic-fuzz/decoder.test.mjs
